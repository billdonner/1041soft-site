<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoubleQross — Screenshots</title>
<style>
:root {
  --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: #ffffff;
  --accent: #0071e3; --line: rgba(0,0,0,.10);
  /* The App Store shows ~12px of gutter per 393pt of phone width. */
  --gutter: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --fg: #f5f5f7; --muted: #98989d; --card: #1c1c1e; --line: rgba(255,255,255,.14); }
}
* { box-sizing: border-box; }
/* An id selector like `#gallery { display: flex }` outranks the UA
   stylesheet's `[hidden] { display: none }`, so the strip stayed visible
   when switching modes and the switch looked broken. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap;
}
.icon { width: 52px; height: 52px; border-radius: 12px; flex: none; }
.icon.placeholder { background: linear-gradient(135deg,#6d59e6,#e33a8c); }
.identity { flex: 1 1 200px; min-width: 0; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
.identity p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.siblings { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
.siblings a, .siblings .here {
  font-size: 12px; padding: 3px 10px; border-radius: 20px; text-decoration: none;
  border: 1px solid var(--line); color: var(--muted);
}
.siblings a:hover { color: var(--fg); }
.siblings .here { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
.modes { display: flex; gap: 2px; background: var(--line); padding: 2px; border-radius: 9px; }
.modes button {
  appearance: none; border: 0; background: transparent; color: var(--fg);
  font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
}
.modes button.active { background: var(--card); font-weight: 600; }
main { padding: 20px 0 8px; }
/* Horizontal strip with scroll snapping — the store's own interaction. */
#gallery {
  display: flex; gap: var(--gutter); overflow-x: auto; padding: 0 20px 18px;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
}
#gallery figure { margin: 0; flex: none; scroll-snap-align: center; }
#gallery img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); }
#gallery figcaption { color: var(--muted); font-size: 12px; padding-top: 6px; text-align: center; }
/* On-device mode: proportions taken from the app's BezelGeometry. */
.mode-device figure {
  padding: 10px; background: #2c2c2e; border-radius: 30px;
  /* A hairline ring so the frame separates from a black page in dark mode,
     where a #1c1c1e frame on a #000 background was invisible. */
  box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 10px 26px rgba(0,0,0,.38);
}
@media (prefers-color-scheme: light) {
  .mode-device figure { background: #1c1c1e; box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 10px 26px rgba(0,0,0,.22); }
}
.mode-device img { border-radius: 20px; border: 0; }
.mode-device figcaption { color: var(--muted); }
/* Store page: a phone-width column, like a product page on a phone. */
#store { max-width: 420px; margin: 0 auto; padding: 0 20px 24px; }
.store-head { display: flex; gap: 14px; align-items: center; }
.store-head h2 { font-size: 19px; margin: 0 0 2px; }
.store-head p { margin: 0; color: var(--muted); font-size: 12px; }
.get { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 6px 18px; font-weight: 600; font-size: 13px; }
.ratings { display: flex; gap: 22px; padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.ratings b { display: block; font-size: 15px; color: var(--fg); letter-spacing: 0; text-transform: none; }
.store-strip { display: flex; gap: var(--gutter); overflow-x: auto; padding: 16px 0; scroll-snap-type: x mandatory; }
.store-strip img { flex: none; width: 62%; border-radius: 12px; border: 1px solid var(--line); scroll-snap-align: center; }
.store-desc { font-size: 14px; white-space: pre-wrap; }
/* Suggestions */
#suggest { border-top: 1px solid var(--line); padding: 18px 20px 28px; }
#suggest h2 { font-size: 15px; margin: 0 0 4px; }
#suggest .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
#suggest details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
#suggest summary { cursor: pointer; font-size: 14px; }
#suggest label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
#suggest input, #suggest textarea {
  width: 100%; font: inherit; padding: 7px 9px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
#suggest .edited summary::after { content: " · edited"; color: #c76a1c; font-size: 12px; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.actions button { font: inherit; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.actions button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
.actions button:disabled { opacity: .45; cursor: default; }
.count { color: var(--muted); font-size: 13px; }
footer { padding: 0 20px 30px; color: var(--muted); font-size: 12px; max-width: 700px; }
</style>
</head>

const POSTERS = [];
const ASPECT = 0.750000;
const GALLERY = "DoubleQross";
const APP_NAME = "DoubleQross";
const APP_DESCRIPTION = "";
const ITEM_COUNT = 3;
const SUBTITLE = "";
const gallery = document.getElementById('gallery');
const store = document.getElementById('store');

// Slot width follows the mode: a wide strip for comparing, narrower on
// device so the frame fits.
function slotWidth(mode) {
  const available = Math.min(window.innerWidth - 40, 1100);
  const perView = mode === 'device' ? 2.1 : 2.6;
  return Math.max(180, Math.min(360, available / perView));
}

function renderGallery(mode) {
  const w = slotWidth(mode);
  gallery.className = mode === 'device' ? 'mode-device' : 'mode-flat';
  gallery.innerHTML = SLOTS.map(s => `
    <figure style="width:${w}px">
      <img src="${s.src}" alt="Slot ${s.n}" loading="lazy" style="aspect-ratio:${ASPECT}">
      <figcaption>${s.label}${s.headline ? ' · ' + escapeHTML(s.headline) : ''}</figcaption>
    </figure>`).join('');
}

function renderStore() {
  const shots = POSTERS.concat(SLOTS.map(s => s.src));
  store.innerHTML = `
    <div class="store-head">
      ${document.querySelector('header .icon').outerHTML}
      <div><h2>${escapeHTML(APP_NAME)}</h2>${SUBTITLE ? `<p>${escapeHTML(SUBTITLE)}</p>` : ''}</div>
      <button class="get">GET</button>
    </div>
    <div class="ratings">
      <div>Rating<b>—</b></div><div>Age<b>4+</b></div><div>Chart<b>—</b></div>
    </div>
    <div class="store-strip">
      ${shots.map(src => `<img src="${src}" alt="" loading="lazy" style="aspect-ratio:${ASPECT}">`).join('')}
    </div>
    ${APP_DESCRIPTION ? `<p class="store-desc">${escapeHTML(APP_DESCRIPTION)}</p>` : ''}`;
}

document.querySelectorAll('.modes button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    const mode = button.dataset.mode;
    const isStore = mode === 'store';
    gallery.hidden = isStore;
    store.hidden = !isStore;
    if (isStore) renderStore(); else renderGallery(mode);
  });
});

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// One entry per ITEM, not per slot: a panorama spans several slots but has a
// single caption, and suggestions are applied by item identity.
const suggestPanel = document.getElementById('slides');
if (suggestPanel) {
  const seen = new Map();
  SLOTS.forEach(s => { if (!seen.has(s.id)) seen.set(s.id, s); });
  const items = [...seen.values()];

  suggestPanel.innerHTML = items.map(s => `
    <details data-id="${s.id}">
      <summary>Slot ${s.label} — ${escapeHTML(s.headline || 'no caption')}</summary>
      <label>Headline</label>
      <input type="text" data-field="caption" value="${escapeHTML(s.headline)}">
      <label>Subtitle</label>
      <input type="text" data-field="secondaryCaption" value="${escapeHTML(s.subtitle)}">
      <label>Note (never applied — just for the author to read)</label>
      <input type="text" data-field="note" placeholder="e.g. this reads as an error">
    </details>`).join('');

  const originals = new Map(items.map(s => [s.id, s]));
  const download = document.getElementById('download');
  const pending = document.getElementById('pending');

  function collect() {
    const slides = [];
    suggestPanel.querySelectorAll('details').forEach(row => {
      const id = row.dataset.id;
      const original = originals.get(id);
      const value = field => row.querySelector(`[data-field="${field}"]`).value;
      const entry = { itemID: id };
      // Send only real changes: null means "no opinion", "" means "clear it".
      if (value('caption') !== original.headline) entry.caption = value('caption');
      if (value('secondaryCaption') !== original.subtitle) entry.secondaryCaption = value('secondaryCaption');
      if (value('note')) entry.note = value('note');
      const changed = 'caption' in entry || 'secondaryCaption' in entry || 'note' in entry;
      row.classList.toggle('edited', changed);
      if (changed) slides.push(entry);
    });
    return slides;
  }

  function refresh() {
    const slides = collect();
    const note = document.getElementById('overall').value;
    const any = slides.length > 0 || note.length > 0;
    download.disabled = !any;
    pending.textContent = any
      ? `${slides.length} slide${slides.length === 1 ? '' : 's'} touched${note ? ' + overall note' : ''}`
      : 'No changes yet';
  }

  suggestPanel.addEventListener('input', refresh);
  document.getElementById('overall').addEventListener('input', refresh);

  download.addEventListener('click', () => {
    const note = document.getElementById('overall').value;
    // Exactly the shape ReviewSuggestions decodes — same file the iOS
    // companion writes, so the Mac needs no new ingest path.
    const payload = {
      schemaVersion: 1,
      galleryName: GALLERY,
      itemCountWhenWritten: ITEM_COUNT,
      writtenAt: new Date().toISOString(),
      slides: collect(),
    };
    if (note) payload.reviewerNote = note;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${GALLERY || 'gallery'}-review.json`;
    link.click();
    URL.revokeObjectURL(link.href);
  });
}

renderGallery('flat');
window.addEventListener('resize', () => {
  const active = document.querySelector('.modes button.active').dataset.mode;
  if (active === 'store') renderStore(); else renderGallery(active);
});
</script>
</body>
</html>
